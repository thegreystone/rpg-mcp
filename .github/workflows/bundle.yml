name: Bundles

# Build the MCP Bundles (.mcpb) for an already published release and attach them to it. Bundles exist
# only for the platforms Claude Desktop runs on: macOS and Windows. The release workflow builds them on
# every tag; this one exists for releases cut before it did, and for re-packing after a binary on the
# release was replaced (the Windows signing script re-packs its own bundle, so usually only macOS is
# needed). Each bundle is packed on its own platform so the executable bit is preserved.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the "v" prefix (e.g. 0.1.2)'
        required: true
        type: string
      platforms:
        description: 'Which bundles to build'
        required: true
        type: choice
        default: all
        options:
          - all
          - macos-only

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            suffix: macos-aarch64
            exe: ''
            mcpb_platform: darwin
          - os: windows-latest
            suffix: windows-x86_64
            exe: '.exe'
            mcpb_platform: win32
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download binary from release
        if: inputs.platforms == 'all' || matrix.mcpb_platform == 'darwin'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target
          gh release download "v${{ inputs.version }}" \
            --pattern "rpg-mcp-server-${{ inputs.version }}-${{ matrix.suffix }}${{ matrix.exe }}" --dir target

      - name: Package MCP bundle
        if: inputs.platforms == 'all' || matrix.mcpb_platform == 'darwin'
        shell: bash
        run: |
          bash mcpb/pack.sh "${{ inputs.version }}" "${{ matrix.suffix }}" "${{ matrix.mcpb_platform }}" \
            "target/rpg-mcp-server-${{ inputs.version }}-${{ matrix.suffix }}${{ matrix.exe }}" \
            "target/rpg-mcp-server-${{ inputs.version }}-${{ matrix.suffix }}.mcpb"

      - name: Attach bundle to release
        if: inputs.platforms == 'all' || matrix.mcpb_platform == 'darwin'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ inputs.version }}" --clobber \
            "target/rpg-mcp-server-${{ inputs.version }}-${{ matrix.suffix }}.mcpb"
