name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B package

      - name: Upload uber-jar
        uses: actions/upload-artifact@v5
        with:
          name: rpg-mcp-server
          path: target/rpg-mcp-server-*-runner.jar
          retention-days: 14
