# =============================================================================
# RPG MCP Server Configuration
# =============================================================================
quarkus.application.name=rpg-mcp-server
# Where canonical state lives. One SQLite file (rpg.db) per installation.
rpg.data-dir=${user.home}/.rpg-mcp
%test.rpg.data-dir=target/test-data/${quarkus.uuid}
# Logging — keep stdout clean for STDIO transport
quarkus.log.console.enabled=false
quarkus.log.file.enabled=true
quarkus.log.file.path=${user.home}/.rpg-mcp/rpg-mcp-server.log
# Desktop hosts start several instances at once (main + shared pool); rotating on boot makes them fight over the
# open log file on Windows. Rotate on size only.
quarkus.log.file.rotation.rotate-on-boot=false
%test.quarkus.log.file.path=target/rpg-mcp-server.log
# Uber-jar for easy distribution
quarkus.package.jar.type=uber-jar
# Native image: embed migrations, seed data and protocol guidance as classpath resources
quarkus.native.resources.includes=db/migration/*.sql,seed/**,protocol/**,NOTICE
# Size budget: the universal MCP bundle carries four native binaries and must stay under 50 MB (see DEVGUIDE).
# The server talks stdio and a local SQLite file only, so everything network-shaped is left out of the image:
#  - no http URL handler (Quarkus adds it by default);
#  - the sqlite-jdbc native-image.properties is excluded because its --enable-url-protocols=jar drags the jar
#    verifier and with it X.509/PKCS7 and every JCA provider into the image; its feature (which embeds the one
#    native library for the build platform) is registered by hand instead;
#  - se.hirt.mcp.rpg.graal substitutes the log handlers' SSL socket factories so JSSE is unreachable.
quarkus.native.enable-http-url-handler=false
# (both --exclude-config arguments are regular expressions; the unescaped dots are good enough here)
quarkus.native.additional-build-args=-Os,\
  --exclude-config,org.xerial.sqlite-jdbc,/META-INF/native-image/org.xerial/sqlite-jdbc/native-image.properties,\
  --features=org.sqlite.nativeimage.SqliteJdbcFeature
# tools/list is cursor-paginated; keep the whole surface on one page for clients that do not follow cursors
quarkus.mcp.server.tools.page-size=100
